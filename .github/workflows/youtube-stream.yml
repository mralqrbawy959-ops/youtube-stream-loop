name: YouTube Live Stream (Lite Edition)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 5'
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'

concurrency:
  group: youtube-live
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core jq curl

      - name: Detect Day and Pick Audio
        id: day
        env:
          AUDIO_URL_BAQARAH: ${{ secrets.AUDIO_URL }}
          AUDIO_URL_KAHF: ${{ secrets.AUDIO_URL_KAHF }}
        run: |
          DAY_NUM=$(TZ='Asia/Amman' date +%u)
          if [ "$DAY_NUM" = "5" ]; then
            echo "is_friday=true" >> $GITHUB_OUTPUT
            echo "surah_name=Surah Al-Kahf" >> $GITHUB_OUTPUT
            echo "audio_url=$AUDIO_URL_KAHF" >> $GITHUB_OUTPUT
          else
            echo "is_friday=false" >> $GITHUB_OUTPUT
            echo "surah_name=Surah Al-Baqarah" >> $GITHUB_OUTPUT
            echo "audio_url=$AUDIO_URL_BAQARAH" >> $GITHUB_OUTPUT
          fi

      - name: Download Audio
        run: |
          wget -q --show-progress -O audio.mp3 "${{ steps.day.outputs.audio_url }}"
          ls -lh audio.mp3

      - name: Normalize Images
        run: |
          mkdir -p normalized
          for img in cover*.jpg 20m.jpg; do
            [ -f "$img" ] || continue
            ffmpeg -y -loglevel error -i "$img" \
              -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1,format=yuv420p" \
              -q:v 2 "normalized/$img"
          done

      - name: Fetch Prayer Times
        id: data
        run: |
          RESP=$(curl -s --max-time 20 "https://api.aladhan.com/v1/timingsByCity?city=Amman&country=Jordan&method=23" || echo "")
          if echo "$RESP" | grep -q '"Fajr"'; then
            FAJR=$(echo "$RESP" | jq -r '.data.timings.Fajr' | cut -d' ' -f1 | tr ':' '.')
            DHUHR=$(echo "$RESP" | jq -r '.data.timings.Dhuhr' | cut -d' ' -f1 | tr ':' '.')
            ASR=$(echo "$RESP" | jq -r '.data.timings.Asr' | cut -d' ' -f1 | tr ':' '.')
            MAGHRIB=$(echo "$RESP" | jq -r '.data.timings.Maghrib' | cut -d' ' -f1 | tr ':' '.')
            ISHA=$(echo "$RESP" | jq -r '.data.timings.Isha' | cut -d' ' -f1 | tr ':' '.')
          else
            FAJR="05.15"; DHUHR="12.30"; ASR="15.45"; MAGHRIB="18.30"; ISHA="19.55"
          fi
          echo "prayer_main=Amman  Fajr $FAJR  Dhuhr $DHUHR  Asr $ASR  Maghrib $MAGHRIB  Isha $ISHA" >> $GITHUB_OUTPUT
          echo "gregorian=$(TZ='Asia/Amman' date '+%Y/%m/%d')" >> $GITHUB_OUTPUT

      - name: Create Image Playlist
        env:
          IS_FRIDAY: ${{ steps.day.outputs.is_friday }}
        run: |
          > images.txt
          if [ "$IS_FRIDAY" = "true" ]; then
            if [ -f "normalized/20m.jpg" ]; then
              echo "file 'normalized/20m.jpg'" >> images.txt
              echo "duration 1200" >> images.txt
            fi
            for img in $(ls normalized/cover[2-9].jpg 2>/dev/null | shuf); do
              echo "file '$img'" >> images.txt
              echo "duration 60" >> images.txt
            done
          else
            echo "file 'normalized/cover.jpg'" >> images.txt
            echo "duration 1200" >> images.txt
            for img in $(ls normalized/cover[1-9].jpg 2>/dev/null | shuf); do
              echo "file '$img'" >> images.txt
              echo "duration 60" >> images.txt
            done
          fi

      - name: Stream to YouTube
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          TZ: 'Asia/Amman'
          PRAYER_MAIN: ${{ steps.data.outputs.prayer_main }}
          GREGORIAN: ${{ steps.data.outputs.gregorian }}
          SURAH: ${{ steps.day.outputs.surah_name }}
          IS_FRIDAY: ${{ steps.day.outputs.is_friday }}
        run: |
          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "Stream key missing"
            exit 1
          fi

          RTMP_URL="rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"
          FONT="/usr/share/fonts/truetype/noto/NotoNaskhArabic-Regular.ttf"
          [ ! -f "$FONT" ] && FONT="/usr/share/fonts/opentype/noto/NotoNaskhArabic-Regular.ttf"
          [ ! -f "$FONT" ] && FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          # بناء سلسلة الفلاتر - بسيطة وثابتة (بدون reload أو zoompan)
          VF="scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1,format=yuv420p"
          VF="$VF,drawtext=fontfile=$FONT:text='$PRAYER_MAIN':fontsize=22:fontcolor=gold:x=40:y=40:box=1:boxcolor=black@0.6:boxborderw=10"
          VF="$VF,drawtext=fontfile=$FONT:text='$GREGORIAN':fontsize=22:fontcolor=white:x=40:y=90:box=1:boxcolor=black@0.6:boxborderw=10"
          VF="$VF,drawtext=fontfile=$FONT:text='$SURAH':fontsize=28:fontcolor=gold:x=w-tw-40:y=40:box=1:boxcolor=black@0.6:boxborderw=12"
          VF="$VF,drawtext=fontfile=$FONT:text='Live Quran Stream':fontsize=24:fontcolor=white:x=(w-tw)/2:y=h-90:box=1:boxcolor=black@0.6:boxborderw=12"

          if [ "$IS_FRIDAY" = "true" ]; then
            VF="$VF,drawtext=fontfile=$FONT:text='Jumua Mubaraka':fontsize=34:fontcolor=gold:x=(w-tw)/2:y=200:box=1:boxcolor=black@0.7:boxborderw=16"
          fi

          echo "Starting stream..."
          echo "Active filters: $(echo "$VF" | grep -o 'drawtext' | wc -l)"

          timeout 21300 ffmpeg \
            -re -stream_loop -1 -f concat -safe 0 -i images.txt \
            -re -stream_loop -1 -i audio.mp3 \
            -vf "$VF" \
            -c:v libx264 -preset veryfast -tune stillimage \
            -b:v 1500k -maxrate 1500k -bufsize 3000k -g 50 \
            -c:a aac -b:a 192k -ar 44100 \
            -f flv "$RTMP_URL" || echo "Stream stopped"
