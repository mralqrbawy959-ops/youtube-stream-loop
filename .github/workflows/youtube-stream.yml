name: YouTube Live Stream (Ultimate Arabic Edition)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 5'
    - cron: '0 8 * * *'
    - cron: '5 14 * * *'

concurrency:
  group: youtube-live
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core jq curl

      - name: Verify Arabic Font
        run: |
          FONT="/usr/share/fonts/truetype/noto/NotoNaskhArabic-Regular.ttf"
          if [ ! -f "$FONT" ]; then
            FONT=$(find /usr/share/fonts -name "NotoNaskhArabic*.ttf" 2>/dev/null | head -1)
          fi
          if [ -z "$FONT" ]; then
            echo "Arabic font missing!"
            exit 1
          fi
          echo "Arabic font OK: $FONT"

      - name: Detect Day and Pick Audio
        id: day
        env:
          AUDIO_URL_BAQARAH: ${{ secrets.AUDIO_URL }}
          AUDIO_URL_KAHF: ${{ secrets.AUDIO_URL_KAHF }}
        run: |
          DAY_NUM=$(TZ='Asia/Amman' date +%u)
          if [ "$DAY_NUM" = "5" ]; then
            echo "is_friday=true" >> $GITHUB_OUTPUT
            echo "audio_url=$AUDIO_URL_KAHF" >> $GITHUB_OUTPUT
            echo "surah_ar=سورة الكهف" >> $GITHUB_OUTPUT
          else
            echo "is_friday=false" >> $GITHUB_OUTPUT
            echo "audio_url=$AUDIO_URL_BAQARAH" >> $GITHUB_OUTPUT
            echo "surah_ar=سورة البقرة" >> $GITHUB_OUTPUT
          fi

      - name: Download Audio and Rain Sound
        env:
          RAIN_URL: ${{ secrets.RAIN_SOUND_IN_THE_BACKGROUND }}
        run: |
          echo "Downloading main audio..."
          wget -q --show-progress -O audio.mp3 "${{ steps.day.outputs.audio_url }}"
          ls -lh audio.mp3
          
          echo "Downloading rain sound..."
          wget -q --show-progress -O rain.mp3 "$RAIN_URL"
          ls -lh rain.mp3
          
          echo "Both files downloaded successfully."

      - name: Normalize Images
        run: |
          mkdir -p normalized
          for img in cover*.jpg 20m.jpg; do
            [ -f "$img" ] || continue
            ffmpeg -y -loglevel error -i "$img" \
              -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1,format=yuv420p" \
              -q:v 2 "normalized/$img"
          done

      - name: Fetch Prayer Times
        id: data
        run: |
          RESP=$(curl -s --max-time 20 "https://api.aladhan.com/v1/timingsByCity?city=Amman&country=Jordan&method=23" || echo "")
          if echo "$RESP" | grep -q '"Fajr"'; then
            A_F=$(echo "$RESP" | jq -r '.data.timings.Fajr' | cut -d' ' -f1)
            A_D=$(echo "$RESP" | jq -r '.data.timings.Dhuhr' | cut -d' ' -f1)
            A_A=$(echo "$RESP" | jq -r '.data.timings.Asr' | cut -d' ' -f1)
            A_M=$(echo "$RESP" | jq -r '.data.timings.Maghrib' | cut -d' ' -f1)
            A_I=$(echo "$RESP" | jq -r '.data.timings.Isha' | cut -d' ' -f1)
          else
            A_F="05:15"; A_D="12:30"; A_A="15:45"; A_M="18:30"; A_I="19:55"
          fi
          echo "amman_fajr=$A_F" >> $GITHUB_OUTPUT
          echo "amman_dhuhr=$A_D" >> $GITHUB_OUTPUT
          echo "amman_asr=$A_A" >> $GITHUB_OUTPUT
          echo "amman_maghrib=$A_M" >> $GITHUB_OUTPUT
          echo "amman_isha=$A_I" >> $GITHUB_OUTPUT

          RESP_M=$(curl -s --max-time 20 "https://api.aladhan.com/v1/timingsByCity?city=Makkah&country=Saudi%20Arabia&method=4" || echo "")
          if echo "$RESP_M" | grep -q '"Fajr"'; then
            M_F=$(echo "$RESP_M" | jq -r '.data.timings.Fajr' | cut -d' ' -f1)
            M_D=$(echo "$RESP_M" | jq -r '.data.timings.Dhuhr' | cut -d' ' -f1)
            M_A=$(echo "$RESP_M" | jq -r '.data.timings.Asr' | cut -d' ' -f1)
            M_M=$(echo "$RESP_M" | jq -r '.data.timings.Maghrib' | cut -d' ' -f1)
            M_I=$(echo "$RESP_M" | jq -r '.data.timings.Isha' | cut -d' ' -f1)
          else
            M_F="05:00"; M_D="12:15"; M_A="15:30"; M_M="18:00"; M_I="19:30"
          fi
          echo "makkah_fajr=$M_F" >> $GITHUB_OUTPUT
          echo "makkah_dhuhr=$M_D" >> $GITHUB_OUTPUT
          echo "makkah_asr=$M_A" >> $GITHUB_OUTPUT
          echo "makkah_maghrib=$M_M" >> $GITHUB_OUTPUT
          echo "makkah_isha=$M_I" >> $GITHUB_OUTPUT

      - name: Create Image Playlist
        env:
          IS_FRIDAY: ${{ steps.day.outputs.is_friday }}
        run: |
          > images.txt
          if [ "$IS_FRIDAY" = "true" ]; then
            [ -f "normalized/20m.jpg" ] && echo "file 'normalized/20m.jpg'" >> images.txt && echo "duration 1200" >> images.txt
            for img in $(ls normalized/cover[2-9].jpg 2>/dev/null | shuf); do
              echo "file '$img'" >> images.txt
              echo "duration 60" >> images.txt
            done
          else
            echo "file 'normalized/cover.jpg'" >> images.txt
            echo "duration 1200" >> images.txt
            for img in $(ls normalized/cover[1-9].jpg 2>/dev/null | shuf); do
              echo "file '$img'" >> images.txt
              echo "duration 60" >> images.txt
            done
          fi

      - name: Prepare Content Pools
        env:
          IS_FRIDAY: ${{ steps.day.outputs.is_friday }}
        run: |
          if [ "$IS_FRIDAY" = "true" ]; then
            printf '%s\n' \
              "من قرأ سورة الكهف يوم الجمعة أضاء له من النور ما بين الجمعتين" \
              "من قرأ سورة الكهف في يوم الجمعة عصم من فتنة الدجال" \
              "الجمعة سيد الأيام وسورة الكهف تاجها" \
              "أكثروا من الصلاة عليّ يوم الجمعة فإنها معروضة عليّ" \
              "إن في الجمعة ساعة لا يوافقها مسلم يسأل الله فيها خيراً إلا أعطاه" \
              "خير يوم طلعت عليه الشمس يوم الجمعة" \
              > hadith_pool.txt
          else
            printf '%s\n' \
              "لا تجعلوا بيوتكم مقابر، إن الشيطان ينفر من البيت الذي تُقرأ فيه سورة البقرة" \
              "اقرؤوا سورة البقرة، فإن أخذها بركة، وتركها حسرة، ولا تستطيعها البطلة" \
              "من قرأ الآيتين الأخيرتين من سورة البقرة في ليلة كفتاه" \
              "آية الكرسي أعظم آية في كتاب الله، وهي في سورة البقرة" \
              "إن لكل شيء سناماً، وإن سنام القرآن سورة البقرة" \
              "خيركم من تعلم القرآن وعلمه" \
              > hadith_pool.txt
          fi

          printf '%s\n' \
            "سبحان الله وبحمده، سبحان الله العظيم" \
            "لا إله إلا الله وحده لا شريك له" \
            "الحمد لله رب العالمين" \
            "الله أكبر كبيراً، والحمد لله كثيراً" \
            "لا حول ولا قوة إلا بالله" \
            "أستغفر الله العظيم وأتوب إليه" \
            "اللهم صلِّ وسلم على نبينا محمد" \
            "حسبي الله ونعم الوكيل" \
            > adhkar_pool.txt

          printf '%s\n' \
            "اكتب في التعليقات: صلوا على النبي محمد ﷺ" \
            "شارك البث مع أحبابك، فالدال على الخير كفاعله" \
            "اشترك في القناة وفعّل الجرس ليصلك كل جديد" \
            "اكتب في التعليقات: لا إله إلا الله" \
            "اكتب في التعليقات: سبحان الله وبحمده" \
            "لا تنسونا من صالح دعائكم" \
            "شغّل البث في بيتك لتغمره البركة والسكينة" \
            "اضغط زر الإعجاب لدعم القناة" \
            > cta_pool.txt

      - name: Stream to YouTube
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          TZ: 'Asia/Amman'
          IS_FRIDAY: ${{ steps.day.outputs.is_friday }}
          SURAH_AR: ${{ steps.day.outputs.surah_ar }}
          A_F: ${{ steps.data.outputs.amman_fajr }}
          A_D: ${{ steps.data.outputs.amman_dhuhr }}
          A_A: ${{ steps.data.outputs.amman_asr }}
          A_M: ${{ steps.data.outputs.amman_maghrib }}
          A_I: ${{ steps.data.outputs.amman_isha }}
          M_F: ${{ steps.data.outputs.makkah_fajr }}
          M_D: ${{ steps.data.outputs.makkah_dhuhr }}
          M_A: ${{ steps.data.outputs.makkah_asr }}
          M_M: ${{ steps.data.outputs.makkah_maghrib }}
          M_I: ${{ steps.data.outputs.makkah_isha }}
        run: |
          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "Stream key missing"
            exit 1
          fi

          RTMP_URL="rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"

          FONT="/usr/share/fonts/truetype/noto/NotoNaskhArabic-Regular.ttf"
          [ ! -f "$FONT" ] && FONT=$(find /usr/share/fonts -name "NotoNaskhArabic*.ttf" 2>/dev/null | head -1)
          [ -z "$FONT" ] && FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          echo "Font: $FONT"

          if [ ! -f "info_card.jpg" ]; then
            echo "WARNING: info_card.jpg not found"
            HAS_INFO_CARD="no"
          else
            echo "info_card.jpg found"
            HAS_INFO_CARD="yes"
          fi

          TZ='Asia/Amman' date '+%H.%M' > /tmp/clock.txt
          shuf -n 1 hadith_pool.txt > /tmp/hadith.txt
          shuf -n 1 adhkar_pool.txt > /tmp/dhikr.txt
          shuf -n 1 cta_pool.txt > /tmp/cta.txt

          printf "عمّان: الفجر %s | الظهر %s | العصر %s | المغرب %s | العشاء %s" "$A_F" "$A_D" "$A_A" "$A_M" "$A_I" > /tmp/amman_line.txt
          printf "التاريخ: %s" "$(TZ='Asia/Amman' date '+%Y.%m.%d')" > /tmp/date.txt
          printf "السورة: %s" "$SURAH_AR" > /tmp/surah_ar.txt

          STREAM_START=$(date +%s)
          TODAY_AMMAN=$(TZ='Asia/Amman' date '+%Y-%m-%d')
          NOTIFY_ENABLE=""

          for p in "الفجر|$A_F" "الظهر|$A_D" "العصر|$A_A" "المغرب|$A_M" "العشاء|$A_I"; do
            AR="${p%%|*}"
            t="${p##*|}"
            [ -z "$t" ] && continue
            PE=$(TZ='Asia/Amman' date -d "$TODAY_AMMAN $t" +%s 2>/dev/null)
            [ -z "$PE" ] && continue
            [ "$PE" -lt "$STREAM_START" ] && PE=$((PE + 86400))
            OFFSET=$((PE - STREAM_START))
            if [ "$OFFSET" -ge 0 ] && [ "$OFFSET" -lt 21300 ]; then
              END=$((OFFSET + 180))
              if [ -z "$NOTIFY_ENABLE" ]; then
                NOTIFY_ENABLE="between(t,$OFFSET,$END)"
              else
                NOTIFY_ENABLE="$NOTIFY_ENABLE+between(t,$OFFSET,$END)"
              fi
            fi
          done

          update_countdown() {
            local TZ_NAME="$1"
            local CITY="$2"
            local EMOJI="$3"
            local F="$4"; local D="$5"; local A="$6"; local M="$7"; local I="$8"
            local NOW=$(date +%s)
            local TODAY=$(TZ="$TZ_NAME" date '+%Y-%m-%d')
            local BEST_AR=""; local BEST_OFF=999999

            for p in "الفجر|$F" "الظهر|$D" "العصر|$A" "المغرب|$M" "العشاء|$I"; do
              local AR="${p%%|*}"
              local t="${p##*|}"
              [ -z "$t" ] && continue
              local PE=$(TZ="$TZ_NAME" date -d "$TODAY $t" +%s 2>/dev/null)
              [ -z "$PE" ] && continue
              [ "$PE" -lt "$NOW" ] && PE=$((PE + 86400))
              local OFF=$((PE - NOW))
              if [ "$OFF" -lt "$BEST_OFF" ]; then
                BEST_OFF=$OFF
                BEST_AR="$AR"
              fi
            done

            local HH=$((BEST_OFF / 3600))
            local MM=$(((BEST_OFF % 3600) / 60))
            if [ "$HH" -gt 0 ]; then
              printf "%s %s: صلاة %s بعد %d س و %d د" "$EMOJI" "$CITY" "$BEST_AR" "$HH" "$MM"
            else
              printf "%s %s: صلاة %s بعد %d د" "$EMOJI" "$CITY" "$BEST_AR" "$MM"
            fi
          }

          update_countdown "Asia/Amman" "عمّان" "🕌" "$A_F" "$A_D" "$A_A" "$A_M" "$A_I" > /tmp/cd_amman.txt
          update_countdown "Asia/Riyadh" "مكة" "🕋" "$M_F" "$M_D" "$M_A" "$M_M" "$M_I" > /tmp/cd_makkah.txt

          (while true; do
            sleep 60
            TZ='Asia/Amman' date '+%H.%M' > /tmp/c.tmp && mv /tmp/c.tmp /tmp/clock.txt
            update_countdown "Asia/Amman" "عمّان" "🕌" "$A_F" "$A_D" "$A_A" "$A_M" "$A_I" > /tmp/cda.tmp && mv /tmp/cda.tmp /tmp/cd_amman.txt
            update_countdown "Asia/Riyadh" "مكة" "🕋" "$M_F" "$M_D" "$M_A" "$M_M" "$M_I" > /tmp/cdm.tmp && mv /tmp/cdm.tmp /tmp/cd_makkah.txt
          done) & C_PID=$!

          (while true; do
            sleep 300
            shuf -n 1 hadith_pool.txt > /tmp/h.tmp && mv /tmp/h.tmp /tmp/hadith.txt
          done) & H_PID=$!

          (while true; do
            sleep 180
            shuf -n 1 adhkar_pool.txt > /tmp/d.tmp && mv /tmp/d.tmp /tmp/dhikr.txt
          done) & D_PID=$!

          (while true; do
            sleep 240
            shuf -n 1 cta_pool.txt > /tmp/cta.tmp && mv /tmp/cta.tmp /tmp/cta.txt
          done) & T_PID=$!

          trap "kill $C_PID $H_PID $D_PID $T_PID 2>/dev/null || true" EXIT INT TERM

          # ===== الفلاتر الأساسية =====
          VF_TEXT="fps=25,scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1,format=yuv420p"

          VF_TEXT="$VF_TEXT,drawtext=fontfile=$FONT:textfile=/tmp/clock.txt:reload=1:expansion=none:fontsize=56:fontcolor=white:x=w-tw-40:y=35:box=1:boxcolor=black@0.8:boxborderw=18"
          VF_TEXT="$VF_TEXT,drawtext=fontfile=$FONT:textfile=/tmp/surah_ar.txt:reload=1:expansion=none:text_shaping=1:fontsize=28:fontcolor=0xD4AF37:x=w-tw-40:y=125:box=1:boxcolor=black@0.8:boxborderw=16"
          VF_TEXT="$VF_TEXT,drawtext=fontfile=$FONT:textfile=/tmp/amman_line.txt:expansion=none:text_shaping=1:fontsize=22:fontcolor=0xD4AF37:x=40:y=40:box=1:boxcolor=black@0.8:boxborderw=14"
          VF_TEXT="$VF_TEXT,drawtext=fontfile=$FONT:textfile=/tmp/date.txt:reload=1:expansion=none:text_shaping=1:fontsize=22:fontcolor=white:x=40:y=95:box=1:boxcolor=black@0.8:boxborderw=14"
          VF_TEXT="$VF_TEXT,drawtext=fontfile=$FONT:textfile=/tmp/hadith.txt:reload=1:expansion=none:text_shaping=1:fontsize=26:fontcolor=0xD4AF37:x=(w-tw)/2:y=190:box=1:boxcolor=black@0.85:boxborderw=24"
          VF_TEXT="$VF_TEXT,drawtext=fontfile=$FONT:textfile=/tmp/dhikr.txt:reload=1:expansion=none:text_shaping=1:fontsize=26:fontcolor=white:x=(w-tw)/2:y=260:box=1:boxcolor=black@0.85:boxborderw=22"

          if [ -n "$NOTIFY_ENABLE" ]; then
            VF_TEXT="$VF_TEXT,drawtext=fontfile=$FONT:text='حان الآن وقت الصلاة في عمّان':expansion=none:text_shaping=1:fontsize=60:fontcolor=0xD4AF37:x=(w-tw)/2:y=(h-th)/2:box=1:boxcolor=black@0.9:boxborderw=35:enable='$NOTIFY_ENABLE'"
          fi

          if [ "$IS_FRIDAY" = "true" ]; then
            VF_TEXT="$VF_TEXT,drawtext=fontfile=$FONT:text='جمعة مباركة — يوم سورة الكهف':expansion=none:text_shaping=1:fontsize=34:fontcolor=0xD4AF37:x=(w-tw)/2:y=340:box=1:boxcolor=black@0.85:boxborderw=20"
          fi

          VF_TEXT="$VF_TEXT,drawtext=fontfile=$FONT:text='بث القرآن الكريم مباشر':expansion=none:text_shaping=1:fontsize=24:fontcolor=white:x=(w-tw)/2:y=h-55:box=1:boxcolor=black@0.8:boxborderw=14"
          VF_TEXT="$VF_TEXT,drawtext=fontfile=$FONT:textfile=/tmp/cd_makkah.txt:reload=1:expansion=none:text_shaping=1:fontsize=26:fontcolor=0xD4AF37:x=(w-tw)/2:y=h-120:box=1:boxcolor=black@0.8:boxborderw=16"
          VF_TEXT="$VF_TEXT,drawtext=fontfile=$FONT:textfile=/tmp/cd_amman.txt:reload=1:expansion=none:text_shaping=1:fontsize=26:fontcolor=0xD4AF37:x=(w-tw)/2:y=h-185:box=1:boxcolor=black@0.8:boxborderw=16"
          VF_TEXT="$VF_TEXT,drawtext=fontfile=$FONT:textfile=/tmp/cta.txt:reload=1:expansion=none:text_shaping=1:fontsize=24:fontcolor=0xD4AF37:x=(w-tw)/2:y=h-260:box=1:boxcolor=black@0.85:boxborderw=20"

          if [ "$HAS_INFO_CARD" = "yes" ]; then
            FULL_FILTER="[0:v]$VF_TEXT[stream];[3:v]scale=550:550:force_original_aspect_ratio=decrease,pad=550:550:(ow-iw)/2:(oh-ih)/2:0x0A1929,format=yuv420p[info];[stream][info]overlay=W-w-30:H-h-30,format=yuv420p[vout]"
            FFMPEG_INPUTS="-stream_loop -1 -f concat -safe 0 -i images.txt -re -stream_loop -1 -i audio.mp3 -stream_loop -1 -i rain.mp3 -loop 1 -i info_card.jpg"
            echo "Info card WILL be overlaid (bottom-right, 550x550)"
          else
            FULL_FILTER="[0:v]$VF_TEXT,format=yuv420p[vout]"
            FFMPEG_INPUTS="-stream_loop -1 -f concat -safe 0 -i images.txt -re -stream_loop -1 -i audio.mp3 -stream_loop -1 -i rain.mp3"
            echo "Info card NOT found - proceeding without it"
          fi

          echo "Starting stream..."
          echo "Rain sound level: 60%"
          echo "Filters: $(echo "$VF_TEXT" | grep -o 'drawtext' | wc -l)"

          timeout 21300 ffmpeg \
            $FFMPEG_INPUTS \
            -filter_complex "$FULL_FILTER;[1:a]volume=1.0[main];[2:a]volume=0.60[rain];[main][rain]amix=inputs=2:duration=first:normalize=0[aout]" \
            -map "[vout]" -map "[aout]" \
            -r 25 \
            -c:v libx264 -preset veryfast -tune stillimage \
            -b:v 1500k -maxrate 1500k -bufsize 3000k -g 50 \
            -c:a aac -b:a 192k -ar 44100 \
            -f flv "$RTMP_URL" || echo "Stream stopped"

          kill $C_PID $H_PID $D_PID $T_PID 2>/dev/null || true
