name: YouTube Live Stream (Ultimate Arabic Edition)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 5'
    - cron: '0 8 * * *'
    - cron: '5 14 * * *'

concurrency:
  group: youtube-live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core jq curl

      - name: Verify Arabic Font
        run: |
          FONT="/usr/share/fonts/truetype/noto/NotoNaskhArabic-Regular.ttf"
          [ ! -f "$FONT" ] && FONT=$(find /usr/share/fonts -name "NotoNaskhArabic*.ttf" 2>/dev/null | head -1)
          [ -z "$FONT" ] && { echo "Arabic font missing!"; exit 1; }
          echo "Arabic font OK: $FONT"

      - name: Detect Day and Pick Audio
        id: day
        env:
          AUDIO_URL_BAQARAH: ${{ secrets.AUDIO_URL }}
          AUDIO_URL_KAHF: ${{ secrets.AUDIO_URL_KAHF }}
        run: |
          DAY_NUM=$(TZ='Asia/Amman' date +%u)
          if [ "$DAY_NUM" = "5" ]; then
            echo "is_friday=true" >> $GITHUB_OUTPUT
            echo "audio_url=$AUDIO_URL_KAHF" >> $GITHUB_OUTPUT
            echo "surah_ar=سورة الكهف" >> $GITHUB_OUTPUT
          else
            echo "is_friday=false" >> $GITHUB_OUTPUT
            echo "audio_url=$AUDIO_URL_BAQARAH" >> $GITHUB_OUTPUT
            echo "surah_ar=سورة البقرة" >> $GITHUB_OUTPUT
          fi

      - name: Fetch Prayer Times, Hijri & Weather
        id: data
        run: |
          TODAY_DD=$(TZ='Asia/Amman' date '+%d-%m-%Y')
          TODAY=$(TZ='Asia/Amman' date '+%Y-%m-%d')
          CACHE_FILE="prayer_times_cache.json"
          NEED_FETCH="yes"
          
          if [ -f "$CACHE_FILE" ]; then
            TEST=$(jq -r --arg d "$TODAY_DD" '.Amman | to_entries[] | select(.value.gregorian_date == $d) | .value.fajr' "$CACHE_FILE" 2>/dev/null | head -1)
            [ -n "$TEST" ] && [ "$TEST" != "null" ] && NEED_FETCH="no" && echo "✅ Cache valid"
          fi
          
          if [ "$NEED_FETCH" = "yes" ]; then
            echo "📥 Fetching 2 months..."
            MONTH=$(TZ='Asia/Amman' date '+%m')
            YEAR=$(TZ='Asia/Amman' date '+%Y')
            NEXT_MONTH_NUM=$((10#$MONTH + 1))
            NEXT_YEAR=$YEAR
            [ $NEXT_MONTH_NUM -gt 12 ] && NEXT_MONTH_NUM=1 && NEXT_YEAR=$((YEAR + 1))
            NEXT_MONTH=$(printf "%02d" $NEXT_MONTH_NUM)
            
            declare -A CITIES=(
              ["Amman"]="Amman,Jordan,23"
              ["Jerusalem"]="Jerusalem,Palestine,23"
              ["Damascus"]="Damascus,Syria,23"
              ["Baghdad"]="Baghdad,Iraq,23"
              ["Riyadh"]="Riyadh,Saudi%20Arabia,4"
              ["Cairo"]="Cairo,Egypt,5"
              ["Kuwait"]="Kuwait,Kuwait,9"
            )
            
            TMP_CACHE=$(mktemp)
            echo "{" > "$TMP_CACHE"
            echo "\"generated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"," >> "$TMP_CACHE"
            
            FIRST_CITY=true
            for CITY_KEY in "${!CITIES[@]}"; do
              IFS=',' read -r CN CO ME <<< "${CITIES[$CITY_KEY]}"
              R1=$(curl -s --max-time 30 "https://api.aladhan.com/v1/calendarByCity?city=$CN&country=$CO&method=$ME&month=$MONTH&year=$YEAR" 2>/dev/null || echo "")
              R2=$(curl -s --max-time 30 "https://api.aladhan.com/v1/calendarByCity?city=$CN&country=$CO&method=$ME&month=$NEXT_MONTH&year=$NEXT_YEAR" 2>/dev/null || echo "")
              
              if echo "$R1" | grep -q '"Fajr"'; then
                [ "$FIRST_CITY" = "false" ] && echo "," >> "$TMP_CACHE"
                FIRST_CITY=false
                echo "\"$CITY_KEY\": {" >> "$TMP_CACHE"
                FIRST_DAY=true
                for RES in "$R1" "$R2"; do
                  echo "$RES" | jq -r '.data[] | "\(.date.gregorian.date)|\(.timings.Fajr)|\(.timings.Dhuhr)|\(.timings.Asr)|\(.timings.Maghrib)|\(.timings.Isha)|\(.date.hijri.day)|\(.date.hijri.month.ar)|\(.date.hijri.year)"' 2>/dev/null | while IFS='|' read -r D F DH A M I HD HM HY; do
                    [ "$FIRST_DAY" = "false" ] && echo "," >> "$TMP_CACHE"
                    FIRST_DAY=false
                    echo "  \"$D\": {\"gregorian_date\": \"$D\", \"fajr\": \"${F:0:5}\", \"dhuhr\": \"${DH:0:5}\", \"asr\": \"${A:0:5}\", \"maghrib\": \"${M:0:5}\", \"isha\": \"${I:0:5}\", \"hijri_day\": \"$HD\", \"hijri_month\": \"$HM\", \"hijri_year\": \"$HY\"}" >> "$TMP_CACHE"
                  done
                done
                echo "}" >> "$TMP_CACHE"
              fi
            done
            echo "}" >> "$TMP_CACHE"
            mv "$TMP_CACHE" "$CACHE_FILE"
            echo "✅ Cache: $(du -h $CACHE_FILE | cut -f1)"
          fi
          
          read_val() {
            local V=$(jq -r --arg d "$TODAY_DD" ".$1[\"$d\"].$2 // \"\"" "$CACHE_FILE" 2>/dev/null)
            [ -z "$V" ] || [ "$V" = "null" ] && echo "$3" || echo "$V"
          }
          
          A_F=$(read_val "Amman" "fajr" "05:13")
          A_D=$(read_val "Amman" "dhuhr" "12:25")
          A_A=$(read_val "Amman" "asr" "15:44")
          A_M=$(read_val "Amman" "maghrib" "18:20")
          A_I=$(read_val "Amman" "isha" "19:35")
          M_F=$(read_val "Riyadh" "fajr" "05:00")
          M_D=$(read_val "Riyadh" "dhuhr" "12:15")
          M_A=$(read_val "Riyadh" "asr" "15:30")
          M_M=$(read_val "Riyadh" "maghrib" "18:00")
          M_I=$(read_val "Riyadh" "isha" "19:30")
          
          H_DAY=$(read_val "Amman" "hijri_day" "1")
          H_MONTH=$(read_val "Amman" "hijri_month" "محرم")
          H_YEAR=$(read_val "Amman" "hijri_year" "1448")
          
          echo "amman_fajr=$A_F" >> $GITHUB_OUTPUT
          echo "amman_dhuhr=$A_D" >> $GITHUB_OUTPUT
          echo "amman_asr=$A_A" >> $GITHUB_OUTPUT
          echo "amman_maghrib=$A_M" >> $GITHUB_OUTPUT
          echo "amman_isha=$A_I" >> $GITHUB_OUTPUT
          echo "makkah_fajr=$M_F" >> $GITHUB_OUTPUT
          echo "makkah_dhuhr=$M_D" >> $GITHUB_OUTPUT
          echo "makkah_asr=$M_A" >> $GITHUB_OUTPUT
          echo "makkah_maghrib=$M_M" >> $GITHUB_OUTPUT
          echo "makkah_isha=$M_I" >> $GITHUB_OUTPUT
          echo "hijri_day=$H_DAY" >> $GITHUB_OUTPUT
          echo "hijri_month=$H_MONTH" >> $GITHUB_OUTPUT
          echo "hijri_year=$H_YEAR" >> $GITHUB_OUTPUT
          
          WEATHER=$(curl -s --max-time 10 "https://wttr.in/Amman?format=%t" 2>/dev/null | tr -d ' ' | head -c 10)
          [ -z "$WEATHER" ] && WEATHER="22°C"
          echo "weather=$WEATHER" >> $GITHUB_OUTPUT

      - name: Commit Cache
        if: always()
        run: |
          if [ -f "prayer_times_cache.json" ]; then
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add prayer_times_cache.json
            git diff --staged --quiet || { git commit -m "Update cache [skip ci]"; git push || true; }
          fi

      - name: Download Audio and Rain
        env:
          RAIN_URL: ${{ secrets.RAIN_SOUND_IN_THE_BACKGROUND }}
        run: |
          wget -q --show-progress -O audio.mp3 "${{ steps.day.outputs.audio_url }}"
          wget -q --show-progress -O rain.mp3 "$RAIN_URL"
          ls -lh audio.mp3 rain.mp3

      - name: Normalize Images
        run: |
          mkdir -p normalized
          for img in cover*.jpg 20m.jpg; do
            [ -f "$img" ] || continue
            ffmpeg -y -loglevel error -i "$img" \
              -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1,format=yuv420p" \
              -q:v 2 "normalized/$img"
          done

      - name: Create Image Playlist
        env:
          IS_FRIDAY: ${{ steps.day.outputs.is_friday }}
        run: |
          > images.txt
          if [ "$IS_FRIDAY" = "true" ]; then
            [ -f "normalized/20m.jpg" ] && echo "file 'normalized/20m.jpg'" >> images.txt && echo "duration 1200" >> images.txt
            for img in $(ls normalized/cover[2-9].jpg 2>/dev/null | shuf); do
              echo "file '$img'" >> images.txt
              echo "duration 60" >> images.txt
            done
          else
            echo "file 'normalized/cover.jpg'" >> images.txt
            echo "duration 1200" >> images.txt
            for img in $(ls normalized/cover[1-9].jpg 2>/dev/null | shuf); do
              echo "file '$img'" >> images.txt
              echo "duration 60" >> images.txt
            done
          fi

      - name: Prepare Content Pools
        env:
          IS_FRIDAY: ${{ steps.day.outputs.is_friday }}
        run: |
          if [ "$IS_FRIDAY" = "true" ]; then
            printf '%s\n' \
              "من قرأ سورة الكهف يوم الجمعة أضاء له من النور ما بين الجمعتين" \
              "من قرأ سورة الكهف في يوم الجمعة عصم من فتنة الدجال" \
              "الجمعة سيد الأيام وسورة الكهف تاجها" \
              "أكثروا من الصلاة عليّ يوم الجمعة فإنها معروضة عليّ" \
              > hadith_pool.txt
          else
            printf '%s\n' \
              "لا تجعلوا بيوتكم مقابر، إن الشيطان ينفر من البيت الذي تُقرأ فيه سورة البقرة" \
              "اقرؤوا سورة البقرة، فإن أخذها بركة، وتركها حسرة" \
              "من قرأ الآيتين الأخيرتين من سورة البقرة في ليلة كفتاه" \
              "آية الكرسي أعظم آية في كتاب الله" \
              > hadith_pool.txt
          fi

          printf '%s\n' \
            "سبحان الله وبحمده، سبحان الله العظيم" \
            "لا إله إلا الله وحده لا شريك له" \
            "الحمد لله رب العالمين" \
            "لا حول ولا قوة إلا بالله" \
            "أستغفر الله العظيم وأتوب إليه" \
            "اللهم صلِّ وسلم على نبينا محمد" \
            "حسبي الله ونعم الوكيل" \
            > adhkar_pool.txt

          printf '%s\n' \
            "اكتب في التعليقات: صلوا على النبي محمد ﷺ" \
            "شارك البث مع أحبابك، فالدال على الخير كفاعله" \
            "اشترك في القناة وفعّل الجرس ليصلك كل جديد" \
            "اكتب في التعليقات: لا إله إلا الله" \
            "لا تنسونا من صالح دعائكم" \
            "شغّل البث في بيتك لتغمره البركة والسكينة" \
            > cta_pool.txt

          printf '%s\n' \
            "﴿ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ ﴾" \
            "﴿ وَبَشِّرِ الصَّابِرِينَ ﴾" \
            "﴿ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ﴾" \
            "﴿ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ﴾" \
            "﴿ رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً ﴾" \
            "﴿ إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ ﴾" \
            "﴿ وَذَكِّرْ فَإِنَّ الذِّكْرَىٰ تَنفَعُ الْمُؤْمِنِينَ ﴾" \
            "﴿ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ ﴾" \
            "﴿ وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا ﴾" \
            "﴿ فَاذْكُرُونِي أَذْكُرْكُمْ ﴾" \
            > verses_pool.txt

          printf '%s\n' \
            "🌅 أذكار الصباح: أصبحنا وأصبح الملك لله" \
            "🌅 أذكار الصباح: اللهم بك أصبحنا وبك أمسينا" \
            "🌅 أذكار الصباح: سبحان الله وبحمده 100 مرة" \
            "🌅 أذكار الصباح: آية الكرسي حصن المسلم" \
            "🌅 أذكار الصباح: قل هو الله أحد 3 مرات" \
            > morning_adhkar.txt

          printf '%s\n' \
            "🌙 أذكار المساء: أمسينا وأمسى الملك لله" \
            "🌙 أذكار المساء: اللهم بك أمسينا وبك أصبحنا" \
            "🌙 أذكار المساء: أعوذ بكلمات الله التامات" \
            "🌙 أذكار المساء: بسم الله الذي لا يضر مع اسمه شيء" \
            "🌙 أذكار المساء: سبحان الله وبحمده 100 مرة" \
            > evening_adhkar.txt

      - name: Stream to YouTube
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          TZ: 'Asia/Amman'
          IS_FRIDAY: ${{ steps.day.outputs.is_friday }}
          SURAH_AR: ${{ steps.day.outputs.surah_ar }}
          A_F: ${{ steps.data.outputs.amman_fajr }}
          A_D: ${{ steps.data.outputs.amman_dhuhr }}
          A_A: ${{ steps.data.outputs.amman_asr }}
          A_M: ${{ steps.data.outputs.amman_maghrib }}
          A_I: ${{ steps.data.outputs.amman_isha }}
          M_F: ${{ steps.data.outputs.makkah_fajr }}
          M_D: ${{ steps.data.outputs.makkah_dhuhr }}
          M_A: ${{ steps.data.outputs.makkah_asr }}
          M_M: ${{ steps.data.outputs.makkah_maghrib }}
          M_I: ${{ steps.data.outputs.makkah_isha }}
          H_DAY: ${{ steps.data.outputs.hijri_day }}
          H_MONTH: ${{ steps.data.outputs.hijri_month }}
          H_YEAR: ${{ steps.data.outputs.hijri_year }}
          WEATHER: ${{ steps.data.outputs.weather }}
        run: |
          if [ -z "$YOUTUBE_STREAM_KEY" ]; then echo "Stream key missing"; exit 1; fi

          RTMP_URL="rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"
          FONT="/usr/share/fonts/truetype/noto/NotoNaskhArabic-Regular.ttf"
          [ ! -f "$FONT" ] && FONT=$(find /usr/share/fonts -name "NotoNaskhArabic*.ttf" 2>/dev/null | head -1)
          [ -z "$FONT" ] && FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          [ ! -f "info_card.jpg" ] && HAS_INFO_CARD="no" || HAS_INFO_CARD="yes"

          STREAM_START=$(date +%s)
          TZ='Asia/Amman' date '+%H.%M' > /tmp/clock.txt
          shuf -n 1 hadith_pool.txt > /tmp/hadith.txt
          shuf -n 1 adhkar_pool.txt > /tmp/dhikr.txt
          shuf -n 1 cta_pool.txt > /tmp/cta.txt
          shuf -n 1 verses_pool.txt > /tmp/verse.txt

          AMMAN_DATE="$(TZ='Asia/Amman' date '+%Y.%m.%d')"
          echo "📅 $AMMAN_DATE • 🌙 $H_DAY $H_MONTH $H_YEAR هـ" > /tmp/dates.txt
          echo "📖 السورة: $SURAH_AR" > /tmp/surah_ar.txt
          echo "🌡️ عمّان $WEATHER • 🕋 القبلة 157°" > /tmp/weather_line.txt
          echo "عمّان • الفجر $A_F • الظهر $A_D • العصر $A_A • المغرب $A_M • العشاء $A_I" > /tmp/amman_line.txt
          
          if [ "$IS_FRIDAY" = "true" ]; then
            echo "🎙️ القارئ: ياسر الزيلعي • سورة الكهف" > /tmp/reciter_line.txt
          else
            echo "🎙️ القارئ: ياسر الزيلعي • سورة البقرة" > /tmp/reciter_line.txt
          fi

          STREAM_START_EPOCH=$(date +%s)
          TODAY_AMMAN=$(TZ='Asia/Amman' date '+%Y-%m-%d')
          NOTIFY_BEFORE=""
          NOTIFY_AFTER=""

          for p in "الفجر|$A_F" "الظهر|$A_D" "العصر|$A_A" "المغرب|$A_M" "العشاء|$A_I"; do
            AR="${p%%|*}"; t="${p##*|}"
            [ -z "$t" ] && continue
            PE=$(TZ='Asia/Amman' date -d "$TODAY_AMMAN $t" +%s 2>/dev/null)
            [ -z "$PE" ] && continue
            [ "$PE" -lt "$STREAM_START_EPOCH" ] && PE=$((PE + 86400))
            OFF=$((PE - STREAM_START_EPOCH))
            if [ "$OFF" -ge 0 ] && [ "$OFF" -lt 21300 ]; then
              # 5 دقائق قبل
              BEFORE_START=$((OFF - 300))
              [ "$BEFORE_START" -lt 0 ] && BEFORE_START=0
              ADD="between(t,$BEFORE_START,$OFF)"
              [ -z "$NOTIFY_BEFORE" ] && NOTIFY_BEFORE="$ADD" || NOTIFY_BEFORE="$NOTIFY_BEFORE+$ADD"
              # 3 دقائق بعد
              AFTER_END=$((OFF + 180))
              ADD2="between(t,$OFF,$AFTER_END)"
              [ -z "$NOTIFY_AFTER" ] && NOTIFY_AFTER="$ADD2" || NOTIFY_AFTER="$NOTIFY_AFTER+$ADD2"
            fi
          done

          update_countdown() {
            local TZ_NAME="$1" CITY="$2" EMOJI="$3"
            local F="$4" D="$5" A="$6" M="$7" I="$8"
            local NOW=$(date +%s)
            local TODAY=$(TZ="$TZ_NAME" date '+%Y-%m-%d')
            local BA="" BO=999999
            for p in "الفجر|$F" "الظهر|$D" "العصر|$A" "المغرب|$M" "العشاء|$I"; do
              local AR="${p%%|*}"; local t="${p##*|}"
              [ -z "$t" ] && continue
              local PE=$(TZ="$TZ_NAME" date -d "$TODAY $t" +%s 2>/dev/null)
              [ -z "$PE" ] && continue
              [ "$PE" -lt "$NOW" ] && PE=$((PE + 86400))
              local OFF=$((PE - NOW))
              [ "$OFF" -lt "$BO" ] && BO=$OFF && BA="$AR"
            done
            local HH=$((BO / 3600)); local MM=$(((BO % 3600) / 60))
            if [ "$HH" -gt 0 ]; then
              echo "$EMOJI $CITY • صلاة $BA بعد $HH س و $MM د"
            else
              echo "$EMOJI $CITY • صلاة $BA بعد $MM د"
            fi
          }

          update_countdown "Asia/Amman" "عمّان" "🕌" "$A_F" "$A_D" "$A_A" "$A_M" "$A_I" > /tmp/cd_amman.txt
          update_countdown "Asia/Riyadh" "مكة" "🕋" "$M_F" "$M_D" "$M_A" "$M_M" "$M_I" > /tmp/cd_makkah.txt

          # ===== العمليات الخلفية =====
          (while true; do
            sleep 60
            TZ='Asia/Amman' date '+%H.%M' > /tmp/c.tmp && mv /tmp/c.tmp /tmp/clock.txt
            update_countdown "Asia/Amman" "عمّان" "🕌" "$A_F" "$A_D" "$A_A" "$A_M" "$A_I" > /tmp/cda.tmp && mv /tmp/cda.tmp /tmp/cd_amman.txt
            update_countdown "Asia/Riyadh" "مكة" "🕋" "$M_F" "$M_D" "$M_A" "$M_M" "$M_I" > /tmp/cdm.tmp && mv /tmp/cdm.tmp /tmp/cd_makkah.txt
          done) & C_PID=$!

          (while true; do sleep 300; shuf -n 1 hadith_pool.txt > /tmp/h.tmp && mv /tmp/h.tmp /tmp/hadith.txt; done) & H_PID=$!
          (while true; do sleep 180; shuf -n 1 adhkar_pool.txt > /tmp/d.tmp && mv /tmp/d.tmp /tmp/dhikr.txt; done) & D_PID=$!
          (while true; do sleep 240; shuf -n 1 cta_pool.txt > /tmp/ct.tmp && mv /tmp/ct.tmp /tmp/cta.txt; done) & T_PID=$!
          (while true; do sleep 3600; shuf -n 1 verses_pool.txt > /tmp/v.tmp && mv /tmp/v.tmp /tmp/verse.txt; done) & V_PID=$!

          # ⏱️ عدّاد مدة البث
          (while true; do
            sleep 60
            NOW=$(date +%s)
            ELAPSED=$((NOW - STREAM_START))
            HH=$((ELAPSED / 3600))
            MM=$(((ELAPSED % 3600) / 60))
            DDH=$((ELAPSED % 60))
            printf "⏱️ مدة البث: %02d:%02d:%02d" $HH $MM $DDH > /tmp/duration.txt
          done) & DUR_PID=$!

          # 📿 أذكار صباح/مساء
          (while true; do
            sleep 60
            HOUR=$(TZ='Asia/Amman' date '+%H')
            if [ "$HOUR" -ge 4 ] && [ "$HOUR" -lt 12 ]; then
              shuf -n 1 morning_adhkar.txt > /tmp/dh.tmp && mv /tmp/dh.tmp /tmp/dhikr_am.txt
            else
              shuf -n 1 evening_adhkar.txt > /tmp/dh.tmp && mv /tmp/dh.tmp /tmp/dhikr_am.txt
            fi
          done) & AM_PID=$!
          
          # تحديث أولي
          HOUR=$(TZ='Asia/Amman' date '+%H')
          if [ "$HOUR" -ge 4 ] && [ "$HOUR" -lt 12 ]; then
            shuf -n 1 morning_adhkar.txt > /tmp/dhikr_am.txt
          else
            shuf -n 1 evening_adhkar.txt > /tmp/dhikr_am.txt
          fi

          trap "kill $C_PID $H_PID $D_PID $T_PID $V_PID $DUR_PID $AM_PID 2>/dev/null || true" EXIT INT TERM

          # ===== بناء الفلاتر =====
          VF="fps=25,scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1,format=yuv420p"

          # ═══ الأعلى ═══
          # أعلى يمين: الساعة
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/clock.txt:reload=1:expansion=none:fontsize=56:fontcolor=white:x=w-tw-40:y=35:box=1:boxcolor=black@0.8:boxborderw=18"
          # أعلى يمين: السورة
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/surah_ar.txt:reload=1:expansion=none:text_shaping=1:fontsize=24:fontcolor=0xD4AF37:x=w-tw-40:y=120:box=1:boxcolor=black@0.8:boxborderw=14"
          # أعلى يمين: مدة البث
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/duration.txt:reload=1:expansion=none:text_shaping=1:fontsize=22:fontcolor=white:x=w-tw-40:y=175:box=1:boxcolor=black@0.75:boxborderw=12"

          # أعلى يسار: المواقيت
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/amman_line.txt:expansion=none:text_shaping=1:fontsize=22:fontcolor=0xD4AF37:x=40:y=40:box=1:boxcolor=black@0.8:boxborderw=14"
          # أعلى يسار: التاريخ (ميلادي + هجري)
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/dates.txt:reload=1:expansion=none:text_shaping=1:fontsize=22:fontcolor=white:x=40:y=95:box=1:boxcolor=black@0.8:boxborderw=14"
          # أعلى يسار: الطقس + القبلة
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/weather_line.txt:reload=1:expansion=none:text_shaping=1:fontsize=20:fontcolor=0xD4AF37:x=40:y=145:box=1:boxcolor=black@0.75:boxborderw=12"
          # أعلى يسار: القارئ
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/reciter_line.txt:reload=1:expansion=none:text_shaping=1:fontsize=20:fontcolor=white:x=40:y=195:box=1:boxcolor=black@0.75:boxborderw=12"

          # ═══ الوسط ═══
          # الحديث
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/hadith.txt:reload=1:expansion=none:text_shaping=1:fontsize=24:fontcolor=0xD4AF37:x=(w-tw)/2:y=260:box=1:boxcolor=black@0.85:boxborderw=22"
          # الذكر
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/dhikr.txt:reload=1:expansion=none:text_shaping=1:fontsize=24:fontcolor=white:x=(w-tw)/2:y=325:box=1:boxcolor=black@0.85:boxborderw=20"
          # آية اليوم
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/verse.txt:reload=1:expansion=none:text_shaping=1:fontsize=22:fontcolor=0xFFD700:x=(w-tw)/2:y=390:box=1:boxcolor=black@0.85:boxborderw=20"

          # أذكار صباح/مساء
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/dhikr_am.txt:reload=1:expansion=none:text_shaping=1:fontsize=22:fontcolor=0xFFA500:x=(w-tw)/2:y=455:box=1:boxcolor=black@0.8:boxborderw=18"

          # 🕌 إشعار قبل الصلاة بـ 5 دقائق
          if [ -n "$NOTIFY_BEFORE" ]; then
            VF="$VF,drawtext=fontfile=$FONT:text='🕌 اقترب وقت الصلاة في عمّان':expansion=none:text_shaping=1:fontsize=50:fontcolor=0xD4AF37:x=(w-tw)/2:y=(h-th)/2:box=1:boxcolor=black@0.9:boxborderw=30:enable='$NOTIFY_BEFORE'"
          fi

          # 🕌 إشعار دخول وقت الصلاة
          if [ -n "$NOTIFY_AFTER" ]; then
            VF="$VF,drawtext=fontfile=$FONT:text='🕌 حان الآن وقت الصلاة في عمّان':expansion=none:text_shaping=1:fontsize=55:fontcolor=0xD4AF37:x=(w-tw)/2:y=(h-th)/2:box=1:boxcolor=black@0.9:boxborderw=32:enable='$NOTIFY_AFTER'"
          fi

          # 🎉 الجمعة
          if [ "$IS_FRIDAY" = "true" ]; then
            VF="$VF,drawtext=fontfile=$FONT:text='🎉 جمعة مباركة • يوم سورة الكهف':expansion=none:text_shaping=1:fontsize=32:fontcolor=0xD4AF37:x=(w-tw)/2:y=530:box=1:boxcolor=black@0.85:boxborderw=20"
          fi

          # ═══ الأسفل ═══
          # شعار القناة
          VF="$VF,drawtext=fontfile=$FONT:text='بث القرآن الكريم مباشر':expansion=none:text_shaping=1:fontsize=24:fontcolor=white:x=(w-tw)/2:y=h-55:box=1:boxcolor=black@0.8:boxborderw=14"
          # مكة
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/cd_makkah.txt:reload=1:expansion=none:text_shaping=1:fontsize=24:fontcolor=0xD4AF37:x=(w-tw)/2:y=h-115:box=1:boxcolor=black@0.8:boxborderw=16"
          # عمّان
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/cd_amman.txt:reload=1:expansion=none:text_shaping=1:fontsize=24:fontcolor=0xD4AF37:x=(w-tw)/2:y=h-175:box=1:boxcolor=black@0.8:boxborderw=16"
          # CTA
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/cta.txt:reload=1:expansion=none:text_shaping=1:fontsize=22:fontcolor=0xD4AF37:x=(w-tw)/2:y=h-240:box=1:boxcolor=black@0.85:boxborderw=18"

          VF="$VF,format=yuv420p"

          # ===== info_card overlay =====
          if [ "$HAS_INFO_CARD" = "yes" ]; then
            FULL_FILTER="[0:v]$VF[stream];[3:v]scale=500:500:force_original_aspect_ratio=decrease,pad=500:500:(ow-iw)/2:(oh-ih)/2:0x0A1929,format=yuv420p[info];[stream][info]overlay=x='if(gte(mod(floor(t/3600),2),1),30,W-w-30)':y='H-h-30':enable='lt(mod(t,3600),300)',format=yuv420p[vout]"
            FFMPEG_INPUTS="-stream_loop -1 -f concat -safe 0 -i images.txt -re -stream_loop -1 -i audio.mp3 -stream_loop -1 -i rain.mp3 -framerate 25 -loop 1 -i info_card.jpg"
          else
            FULL_FILTER="[0:v]$VF,format=yuv420p[vout]"
            FFMPEG_INPUTS="-stream_loop -1 -f concat -safe 0 -i images.txt -re -stream_loop -1 -i audio.mp3 -stream_loop -1 -i rain.mp3"
          fi

          echo "Starting stream with all features..."
          echo "Filters: $(echo "$VF" | grep -o 'drawtext' | wc -l)"

          timeout 21300 ffmpeg \
            $FFMPEG_INPUTS \
            -filter_complex "$FULL_FILTER;[1:a]volume=1.0[main];[2:a]volume=0.45[rain];[main][rain]amix=inputs=2:duration=first:normalize=0[aout]" \
            -map "[vout]" -map "[aout]" \
            -r 25 \
            -c:v libx264 -preset veryfast -tune stillimage \
            -b:v 1500k -maxrate 1500k -bufsize 3000k -g 50 \
            -c:a aac -b:a 192k -ar 44100 \
            -f flv "$RTMP_URL" || echo "Stream stopped"

          kill $C_PID $H_PID $D_PID $T_PID $V_PID $DUR_PID $AM_PID 2>/dev/null || true
