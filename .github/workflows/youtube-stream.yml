name: YouTube Live Stream

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'رابط الفيديو المراد بثه'
        required: true
        default: 'https://example.com/video.mp4'
      duration:
        description: 'مدة البث بالثواني (اتركه فارغاً للبث الكامل)'
        required: false
        default: ''

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          sudo wget -q https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      # 👇 هذا هو الجزء الذي كنت تحاول إصلاحه، لاحظ المسافات البادئة
      - name: Download video
        env:
          VIDEO_URL: "${{ github.event.inputs.video_url }}"
        run: |
          echo "⬇️ جاري سحب الفيديو من: $VIDEO_URL"
          yt-dlp --extractor-args "youtube:player_client=mweb" -f "best[ext=mp4]/best" -o /tmp/stream_video.mp4 "$VIDEO_URL"
          ls -lh /tmp/stream_video.mp4

      - name: Stream to YouTube
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          DURATION: ${{ github.event.inputs.duration }}
        run: |
          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "❌ خطأ: لم يتم تعيين مفتاح البث (YOUTUBE_STREAM_KEY) في Secrets"
            exit 1
          fi

          RTMP_URL="rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"
          echo "🎥 بدء البث إلى يوتيوب..."

          CMD="ffmpeg -re -i /tmp/stream_video.mp4 \
            -c:v libx264 -preset veryfast -tune zerolatency \
            -b:v 3000k -maxrate 3000k -bufsize 6000k \
            -pix_fmt yuv420p -g 50 \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv \"$RTMP_URL\""

          if [ -n "$DURATION" ]; then
            CMD="timeout $DURATION $CMD"
          fi

          eval $CMD
