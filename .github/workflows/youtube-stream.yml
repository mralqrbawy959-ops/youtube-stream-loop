      - name: Stream to YouTube
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          TZ: 'Asia/Amman'
          IS_FRIDAY: ${{ steps.day.outputs.is_friday }}
          SURAH_AR: ${{ steps.day.outputs.surah_ar }}
          A_F: ${{ steps.data.outputs.amman_fajr }}
          A_D: ${{ steps.data.outputs.amman_dhuhr }}
          A_A: ${{ steps.data.outputs.amman_asr }}
          A_M: ${{ steps.data.outputs.amman_maghrib }}
          A_I: ${{ steps.data.outputs.amman_isha }}
          M_F: ${{ steps.data.outputs.makkah_fajr }}
          M_D: ${{ steps.data.outputs.makkah_dhuhr }}
          M_A: ${{ steps.data.outputs.makkah_asr }}
          M_M: ${{ steps.data.outputs.makkah_maghrib }}
          M_I: ${{ steps.data.outputs.makkah_isha }}
          WEATHER: ${{ steps.data.outputs.weather }}
        run: |
          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "Stream key missing"
            exit 1
          fi

          RTMP_URL="rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY"
          FONT="/usr/share/fonts/truetype/noto/NotoNaskhArabic-Regular.ttf"
          [ ! -f "$FONT" ] && FONT=$(find /usr/share/fonts -name "NotoNaskhArabic*.ttf" 2>/dev/null | head -1)
          [ -z "$FONT" ] && FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          
          HAS_INFO_CARD="no"
          [ -f "info_card.jpg" ] && HAS_INFO_CARD="yes"

          # ════ إنشاء الملفات الافتراضية ════
          [ ! -f "control.txt" ] && cat > control.txt << 'EOF'
# غرفة الأوامر الكبرى
stream_enabled=yes
rain_volume=0.45
main_volume=1.0
custom_message=
EOF

          [ ! -f "extra_slots.txt" ] && touch extra_slots.txt
          [ ! -d "custom_texts" ] && mkdir -p custom_texts

          # ════ دوال القراءة ════
          get_c() {
            local V=$(grep "^${1}=" control.txt 2>/dev/null | head -1 | cut -d'=' -f2- | tr -d '\r')
            [ -z "$V" ] && echo "$2" || echo "$V"
          }
          get_s() {
            local V=$(grep "^${1}=" stream_config.txt 2>/dev/null | head -1 | cut -d'=' -f2- | tr -d '\r')
            [ -z "$V" ] && echo "$2" || echo "$V"
          }

          # ════ دالة فحص الوقت ════
          in_range() {
            local RANGE="$1"
            local S=$(echo "$RANGE" | cut -d'-' -f1)
            local E=$(echo "$RANGE" | cut -d'-' -f2)
            local NH=$(TZ='Asia/Amman' date '+%H')
            local NM=$(TZ='Asia/Amman' date '+%M')
            local NOWM=$((10#$NH * 60 + 10#$NM))
            local SH=$(echo "$S" | cut -d':' -f1)
            local SM=$(echo "$S" | cut -d':' -f2)
            local EH=$(echo "$E" | cut -d':' -f1)
            local EM=$(echo "$E" | cut -d':' -f2)
            local SMIN=$((10#$SH * 60 + 10#$SM))
            local EMIN=$((10#$EH * 60 + 10#$EM))
            [ "$NOWM" -ge "$SMIN" ] && [ "$NOWM" -le "$EMIN" ] && echo "yes" || echo "no"
          }

          # ════ قراءة control.txt ════
          RAIN_VOL=$(get_c "rain_volume" "0.45")
          MAIN_VOL=$(get_c "main_volume" "1.0")
          STREAM_EN=$(get_c "stream_enabled" "yes")
          
          echo "Stream enabled: $STREAM_EN"
          if [ "$STREAM_EN" = "no" ]; then
            echo "Stream disabled - exiting"
            exit 0
          fi

          # ════ التاريخ الهجري الصحيح ════
          TODAY_G=$(TZ='Asia/Amman' date '+%d-%m-%Y')
          HIJRI_RESP=$(curl -s --max-time 15 "https://api.aladhan.com/v1/gToH?date=$TODAY_G" 2>/dev/null || echo "")
          if echo "$HIJRI_RESP" | grep -q '"hijri"'; then
            H_DAY=$(echo "$HIJRI_RESP" | jq -r '.data.hijri.day')
            H_MONTH=$(echo "$HIJRI_RESP" | jq -r '.data.hijri.month.ar')
            H_YEAR=$(echo "$HIJRI_RESP" | jq -r '.data.hijri.year')
            echo "Hijri: $H_DAY $H_MONTH $H_YEAR"
          else
            H_DAY="1"; H_MONTH="ربيع الآخر"; H_YEAR="1448"
          fi

          # ════ الملفات الديناميكية ════
          TZ='Asia/Amman' date '+%H.%M' > /tmp/clock.txt
          shuf -n 1 hadith_pool.txt > /tmp/hadith.txt 2>/dev/null || echo "لا تجعلوا بيوتكم مقابر" > /tmp/hadith.txt
          shuf -n 1 adhkar_pool.txt > /tmp/dhikr.txt 2>/dev/null || echo "سبحان الله وبحمده" > /tmp/dhikr.txt
          shuf -n 1 cta_pool.txt > /tmp/cta.txt 2>/dev/null || echo "اكتب في التعليقات" > /tmp/cta.txt
          shuf -n 1 verses_pool.txt > /tmp/verse.txt 2>/dev/null || echo "إن الله مع الصابرين" > /tmp/verse.txt

          echo "التاريخ: $(TZ='Asia/Amman' date '+%Y.%m.%d')" > /tmp/date.txt
          echo "السورة: $SURAH_AR" > /tmp/surah_ar.txt
          echo "عمّان: الفجر $A_F - الظهر $A_D - العصر $A_A - المغرب $A_M - العشاء $A_I" > /tmp/amman_line.txt
          echo "التاريخ الهجري: $H_DAY $H_MONTH $H_YEAR هـ" > /tmp/hijri.txt
          CLEAN_W=$(echo "$WEATHER" | sed 's/°//g')
          echo "طقس عمّان: $CLEAN_W" > /tmp/weather.txt
          
          if [ "$IS_FRIDAY" = "true" ]; then
            echo "القارئ: ياسر الزيلعي - سورة الكهف" > /tmp/reciter.txt
          else
            echo "القارئ: ياسر الزيلعي - سورة البقرة" > /tmp/reciter.txt
          fi
          
          echo " " > /tmp/custom_msg.txt
          echo "مدة البث: 00:00:00" > /tmp/duration.txt

          # ════ العد التنازلي ════
          update_cd() {
            local TZ_NAME="$1" CITY="$2"
            local F="$3" D="$4" A="$5" M="$6" I="$7"
            local NOW=$(date +%s)
            local TODAY=$(TZ="$TZ_NAME" date '+%Y-%m-%d')
            local BA="" BO=999999
            for p in "الفجر|$F" "الظهر|$D" "العصر|$A" "المغرب|$M" "العشاء|$I"; do
              local AR="${p%%|*}"; local t="${p##*|}"
              [ -z "$t" ] && continue
              local PE=$(TZ="$TZ_NAME" date -d "$TODAY $t" +%s 2>/dev/null)
              [ -z "$PE" ] && continue
              [ "$PE" -lt "$NOW" ] && PE=$((PE + 86400))
              local OFF=$((PE - NOW))
              [ "$OFF" -lt "$BO" ] && BO=$OFF && BA="$AR"
            done
            local HH=$((BO / 3600)); local MM=$(((BO % 3600) / 60))
            if [ "$HH" -gt 0 ]; then
              echo "$CITY: $BA بعد $HH س و $MM د"
            else
              echo "$CITY: $BA بعد $MM د"
            fi
          }

          update_cd "Asia/Amman" "عمّان" "$A_F" "$A_D" "$A_A" "$A_M" "$A_I" > /tmp/cd_amman.txt
          update_cd "Asia/Riyadh" "مكة" "$M_F" "$M_D" "$M_A" "$M_M" "$M_I" > /tmp/cd_makkah.txt

          # ════ إشعارات الصلاة ════
          STREAM_START=$(date +%s)
          TODAY_AMMAN=$(TZ='Asia/Amman' date '+%Y-%m-%d')
          NOTIFY_BEFORE=""
          NOTIFY_AFTER=""
          for p in "الفجر|$A_F" "الظهر|$A_D" "العصر|$A_A" "المغرب|$A_M" "العشاء|$A_I"; do
            AR="${p%%|*}"; t="${p##*|}"
            [ -z "$t" ] && continue
            PE=$(TZ='Asia/Amman' date -d "$TODAY_AMMAN $t" +%s 2>/dev/null)
            [ -z "$PE" ] && continue
            [ "$PE" -lt "$STREAM_START" ] && PE=$((PE + 86400))
            OFF=$((PE - STREAM_START))
            if [ "$OFF" -ge 0 ] && [ "$OFF" -lt 21300 ]; then
              BS=$((OFF - 300)); [ "$BS" -lt 0 ] && BS=0
              ADD="between(t,$BS,$OFF)"
              [ -z "$NOTIFY_BEFORE" ] && NOTIFY_BEFORE="$ADD" || NOTIFY_BEFORE="$NOTIFY_BEFORE+$ADD"
              AE=$((OFF + 180))
              ADD2="between(t,$OFF,$AE)"
              [ -z "$NOTIFY_AFTER" ] && NOTIFY_AFTER="$ADD2" || NOTIFY_AFTER="$NOTIFY_AFTER+$ADD2"
            fi
          done

          # ════ العمليات الخلفية ════
          # حلقة الساعة + العد التنازلي + فحص stream_enabled
          (while true; do
            sleep 60
            TZ='Asia/Amman' date '+%H.%M' > /tmp/c.tmp && mv /tmp/c.tmp /tmp/clock.txt
            update_cd "Asia/Amman" "عمّان" "$A_F" "$A_D" "$A_A" "$A_M" "$A_I" > /tmp/cda.tmp && mv /tmp/cda.tmp /tmp/cd_amman.txt
            update_cd "Asia/Riyadh" "مكة" "$M_F" "$M_D" "$M_A" "$M_M" "$M_I" > /tmp/cdm.tmp && mv /tmp/cdm.tmp /tmp/cd_makkah.txt
            SC=$(get_c "stream_enabled" "yes")
            if [ "$SC" = "no" ]; then
              echo "Stream disabled by control.txt"
              pkill -f "ffmpeg.*rtmp" 2>/dev/null || true
              exit 0
            fi
          done) & C_PID=$!

          # حلقة النصوص المتغيرة
          (while true; do sleep 300; shuf -n 1 hadith_pool.txt > /tmp/h.tmp 2>/dev/null && mv /tmp/h.tmp /tmp/hadith.txt; done) & H_PID=$!
          (while true; do sleep 180; shuf -n 1 adhkar_pool.txt > /tmp/d.tmp 2>/dev/null && mv /tmp/d.tmp /tmp/dhikr.txt; done) & D_PID=$!
          (while true; do sleep 240; shuf -n 1 cta_pool.txt > /tmp/ct.tmp 2>/dev/null && mv /tmp/ct.tmp /tmp/cta.txt; done) & T_PID=$!
          (while true; do sleep 3600; shuf -n 1 verses_pool.txt > /tmp/v.tmp 2>/dev/null && mv /tmp/v.tmp /tmp/verse.txt; done) & V_PID=$!

          # ⭐ حلقة مدة البث
          (while true; do
            sleep 60
            NOW=$(date +%s)
            EL=$((NOW - STREAM_START))
            HH=$((EL / 3600)); MM=$(((EL % 3600) / 60)); SS=$((EL % 60))
            printf "مدة البث: %02d:%02d:%02d" $HH $MM $SS > /tmp/dur.tmp && mv /tmp/dur.tmp /tmp/duration.txt
          done) & DUR_PID=$!

          # ⭐ حلقة control.txt (فورية)
          (while true; do
            sleep 30
            CM=$(get_c "custom_message" "")
            if [ -n "$CM" ]; then
              echo "$CM" > /tmp/cm.tmp && mv /tmp/cm.tmp /tmp/custom_msg.txt
            else
              echo " " > /tmp/custom_msg.txt
            fi
          done) & CTRL_PID=$!

          trap "kill $C_PID $H_PID $D_PID $T_PID $V_PID $DUR_PID $CTRL_PID 2>/dev/null || true" EXIT INT TERM

          # ════ بناء الفلاتر ════
          VF="fps=25,scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1,format=yuv420p"

          # الساعة
          [ "$(get_s 'clock_enabled' 'yes')" = "yes" ] && [ "$(in_range "$(get_s 'clock_hours' '00:00-23:59')")" = "yes" ] && \
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/clock.txt:reload=1:expansion=none:fontsize=$(get_s 'clock_size' '58'):fontcolor=$(get_s 'clock_color' 'white'):x=$(get_s 'clock_x' 'w-tw-40'):y=$(get_s 'clock_y' '35'):box=1:boxcolor=black@0.85:boxborderw=20"

          # السورة
          [ "$(get_s 'surah_enabled' 'yes')" = "yes" ] && [ "$(in_range "$(get_s 'surah_hours' '00:00-23:59')")" = "yes" ] && \
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/surah_ar.txt:reload=1:expansion=none:text_shaping=1:fontsize=$(get_s 'surah_size' '26'):fontcolor=$(get_s 'surah_color' '0xD4AF37'):x=$(get_s 'surah_x' 'w-tw-40'):y=$(get_s 'surah_y' '125'):box=1:boxcolor=black@0.85:boxborderw=16"

          # المواقيت
          [ "$(get_s 'amman_times_enabled' 'yes')" = "yes" ] && \
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/amman_line.txt:expansion=none:text_shaping=1:fontsize=$(get_s 'amman_times_size' '22'):fontcolor=$(get_s 'amman_times_color' '0xD4AF37'):x=$(get_s 'amman_times_x' '40'):y=$(get_s 'amman_times_y' '40'):box=1:boxcolor=black@0.85:boxborderw=16"

          # التاريخ
          [ "$(get_s 'date_enabled' 'yes')" = "yes" ] && \
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/date.txt:reload=1:expansion=none:text_shaping=1:fontsize=$(get_s 'date_size' '20'):fontcolor=$(get_s 'date_color' 'white'):x=$(get_s 'date_x' '40'):y=$(get_s 'date_y' '95'):box=1:boxcolor=black@0.85:boxborderw=14"

          # الهجري
          [ "$(get_s 'hijri_enabled' 'yes')" = "yes" ] && \
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/hijri.txt:reload=1:expansion=none:text_shaping=1:fontsize=$(get_s 'hijri_size' '20'):fontcolor=$(get_s 'hijri_color' '0xD4AF37'):x=$(get_s 'hijri_x' '40'):y=$(get_s 'hijri_y' '140'):box=1:boxcolor=black@0.85:boxborderw=14"

          # الطقس
          [ "$(get_s 'weather_enabled' 'yes')" = "yes" ] && \
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/weather.txt:reload=1:expansion=none:text_shaping=1:fontsize=$(get_s 'weather_size' '20'):fontcolor=$(get_s 'weather_color' 'white'):x=$(get_s 'weather_x' '40'):y=$(get_s 'weather_y' '185'):box=1:boxcolor=black@0.85:boxborderw=14"

          # القارئ
          [ "$(get_s 'reciter_enabled' 'yes')" = "yes" ] && \
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/reciter.txt:reload=1:expansion=none:text_shaping=1:fontsize=$(get_s 'reciter_size' '20'):fontcolor=$(get_s 'reciter_color' '0xD4AF37'):x=$(get_s 'reciter_x' '40'):y=$(get_s 'reciter_y' '230'):box=1:boxcolor=black@0.85:boxborderw=14"

          # مدة البث
          [ "$(get_s 'duration_enabled' 'yes')" = "yes" ] && \
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/duration.txt:reload=1:expansion=none:text_shaping=1:fontsize=$(get_s 'duration_size' '20'):fontcolor=$(get_s 'duration_color' '0x00FF00'):x=$(get_s 'duration_x' '40'):y=$(get_s 'duration_y' '280'):box=1:boxcolor=black@0.85:boxborderw=14"

          # الحديث
          [ "$(get_s 'hadith_enabled' 'yes')" = "yes" ] && \
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/hadith.txt:reload=1:expansion=none:text_shaping=1:fontsize=$(get_s 'hadith_size' '22'):fontcolor=$(get_s 'hadith_color' '0xD4AF37'):x=(w-tw)/2:y=$(get_s 'hadith_y' '290'):box=1:boxcolor=black@0.9:boxborderw=22"

          # الذكر
          [ "$(get_s 'dhikr_enabled' 'yes')" = "yes" ] && \
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/dhikr.txt:reload=1:expansion=none:text_shaping=1:fontsize=$(get_s 'dhikr_size' '22'):fontcolor=$(get_s 'dhikr_color' 'white'):x=(w-tw)/2:y=$(get_s 'dhikr_y' '350'):box=1:boxcolor=black@0.9:boxborderw=20"

          # آية اليوم
          [ "$(get_s 'verse_enabled' 'yes')" = "yes" ] && \
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/verse.txt:reload=1:expansion=none:text_shaping=1:fontsize=$(get_s 'verse_size' '24'):fontcolor=$(get_s 'verse_color' '0xFFD700'):x=(w-tw)/2:y=$(get_s 'verse_y' '410'):box=1:boxcolor=black@0.9:boxborderw=22"

          # رسالة مخصصة
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/custom_msg.txt:reload=1:expansion=none:text_shaping=1:fontsize=28:fontcolor=0xFF6B6B:x=(w-tw)/2:y=470:box=1:boxcolor=black@0.9:boxborderw=24"

          # ⭐⭐ النصوص الإضافية (extra_slots.txt) ⭐⭐
          # التنسيق: name|x|y|size|color|text_file|hours
          if [ -f "extra_slots.txt" ]; then
            while IFS='|' read -r NAME X Y SIZE COLOR TEXTFILE HOURS; do
              [ -z "$NAME" ] && continue
              [ "${NAME:0:1}" = "#" ] && continue
              [ ! -f "$TEXTFILE" ] && continue
              
              X=${X:-'(w-tw)/2'}
              Y=${Y:-'500'}
              SIZE=${SIZE:-24}
              COLOR=${COLOR:-0xD4AF37}
              HOURS=${HOURS:-'00:00-23:59'}
              
              if [ "$(in_range "$HOURS")" = "yes" ]; then
                echo "Adding extra slot: $NAME from $TEXTFILE"
                VF="$VF,drawtext=fontfile=$FONT:textfile=$TEXTFILE:reload=1:expansion=none:text_shaping=1:fontsize=$SIZE:fontcolor=$COLOR:x=$X:y=$Y:box=1:boxcolor=black@0.9:boxborderw=20"
              fi
            done < extra_slots.txt
          fi

          # إشعارات الصلاة
          [ -n "$NOTIFY_BEFORE" ] && \
          VF="$VF,drawtext=fontfile=$FONT:text='اقترب وقت الصلاة في عمّان':expansion=none:text_shaping=1:fontsize=48:fontcolor=0xD4AF37:x=(w-tw)/2:y=(h-th)/2:box=1:boxcolor=black@0.9:boxborderw=30:enable='$NOTIFY_BEFORE'"

          [ -n "$NOTIFY_AFTER" ] && \
          VF="$VF,drawtext=fontfile=$FONT:text='حان الآن وقت الصلاة في عمّان':expansion=none:text_shaping=1:fontsize=52:fontcolor=0xD4AF37:x=(w-tw)/2:y=(h-th)/2:box=1:boxcolor=black@0.9:boxborderw=32:enable='$NOTIFY_AFTER'"

          if [ "$IS_FRIDAY" = "true" ]; then
            VF="$VF,drawtext=fontfile=$FONT:text='جمعة مباركة - يوم سورة الكهف':expansion=none:text_shaping=1:fontsize=30:fontcolor=0xD4AF37:x=(w-tw)/2:y=540:box=1:boxcolor=black@0.9:boxborderw=20"
          fi

          # CTA
          [ "$(get_s 'cta_enabled' 'yes')" = "yes" ] && \
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/cta.txt:reload=1:expansion=none:text_shaping=1:fontsize=$(get_s 'cta_size' '22'):fontcolor=$(get_s 'cta_color' '0xD4AF37'):x=(w-tw)/2:y=h-$(get_s 'cta_y_offset' '240'):box=1:boxcolor=black@0.85:boxborderw=18"

          # عمّان
          [ "$(get_s 'cd_amman_enabled' 'yes')" = "yes" ] && \
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/cd_amman.txt:reload=1:expansion=none:text_shaping=1:fontsize=$(get_s 'cd_amman_size' '24'):fontcolor=$(get_s 'cd_amman_color' '0xD4AF37'):x=(w-tw)/2:y=h-$(get_s 'cd_amman_y_offset' '175'):box=1:boxcolor=black@0.85:boxborderw=16"

          # مكة
          [ "$(get_s 'cd_makkah_enabled' 'yes')" = "yes" ] && \
          VF="$VF,drawtext=fontfile=$FONT:textfile=/tmp/cd_makkah.txt:reload=1:expansion=none:text_shaping=1:fontsize=$(get_s 'cd_makkah_size' '24'):fontcolor=$(get_s 'cd_makkah_color' '0xD4AF37'):x=(w-tw)/2:y=h-$(get_s 'cd_makkah_y_offset' '115'):box=1:boxcolor=black@0.85:boxborderw=16"

          # شعار القناة
          [ "$(get_s 'brand_enabled' 'yes')" = "yes" ] && \
          VF="$VF,drawtext=fontfile=$FONT:text='بث القرآن الكريم مباشر':expansion=none:text_shaping=1:fontsize=$(get_s 'brand_size' '22'):fontcolor=$(get_s 'brand_color' 'white'):x=(w-tw)/2:y=h-$(get_s 'brand_y_offset' '55'):box=1:boxcolor=black@0.85:boxborderw=14"

          VF="$VF,format=yuv420p"

          # info_card
          if [ "$HAS_INFO_CARD" = "yes" ] && [ "$(get_s 'info_card_enabled' 'yes')" = "yes" ]; then
            IC_SIZE=$(get_s "info_card_size" "500")
            IC_DUR=$(get_s "info_card_duration" "300")
            IC_OFF=$(get_s "info_card_offset" "30")
            FULL_FILTER="[0:v]$VF[stream];[3:v]scale=$IC_SIZE:$IC_SIZE:force_original_aspect_ratio=decrease,pad=$IC_SIZE:$IC_SIZE:(ow-iw)/2:(oh-ih)/2:0x0A1929,format=yuv420p[info];[stream][info]overlay=x='if(gte(mod(floor(t/3600),2),1),30,W-w-$IC_OFF)':y='H-h-$IC_OFF':enable='lt(mod(t,3600),$IC_DUR)',format=yuv420p[vout]"
            FFMPEG_INPUTS="-stream_loop -1 -f concat -safe 0 -i images.txt -re -stream_loop -1 -i audio.mp3 -stream_loop -1 -i rain.mp3 -framerate 25 -loop 1 -i info_card.jpg"
          else
            FULL_FILTER="[0:v]$VF,format=yuv420p[vout]"
            FFMPEG_INPUTS="-stream_loop -1 -f concat -safe 0 -i images.txt -re -stream_loop -1 -i audio.mp3 -stream_loop -1 -i rain.mp3"
          fi

          echo "Starting stream with big command center..."
          echo "Rain: $RAIN_VOL | Main: $MAIN_VOL"

          timeout 21300 ffmpeg \
            $FFMPEG_INPUTS \
            -filter_complex "$FULL_FILTER;[1:a]volume=$MAIN_VOL[main];[2:a]volume=$RAIN_VOL[rain];[main][rain]amix=inputs=2:duration=first:normalize=0[aout]" \
            -map "[vout]" -map "[aout]" \
            -r 25 \
            -c:v libx264 -preset veryfast -tune stillimage \
            -b:v 1500k -maxrate 1500k -bufsize 3000k -g 50 \
            -c:a aac -b:a 192k -ar 44100 \
            -f flv "$RTMP_URL" || echo "Stream stopped"

          kill $C_PID $H_PID $D_PID $T_PID $V_PID $DUR_PID $CTRL_PID 2>/dev/null || true
